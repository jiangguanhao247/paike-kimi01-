<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能排课系统</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .home-content { text-align: center; padding: 80px 20px; }
    .home-content h1 { font-size: 32px; margin-bottom: 16px; }
    .home-content p { font-size: 16px; color: #86868b; margin-bottom: 40px; }
    .module-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .module-card {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .module-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      border-color: #1890ff;
    }
    .module-card .icon {
      width: 48px; height: 48px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      margin-bottom: 14px;
    }
    .module-card h3 { font-size: 16px; margin-bottom: 6px; }
    .module-card p { font-size: 13px; color: #86868b; margin: 0; }
  </style>
</head>
<body>
  <div class="top-nav">
    <div class="logo">
      <div class="logo-icon">📅</div>
      <span>智能排课系统</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="active">首页</a>
      <a href="pages/base-data.html">基础数据</a>
      <a href="pages/course-arrange.html">课程安排</a>
      <a href="pages/teacher-arrange.html">教师安排</a>
      <a href="pages/workbench.html">排课工作台</a>
    </div>
  </div>

  <div class="main-content">
    <div class="home-content">
      <h1>欢迎使用智能排课系统</h1>
      <p>请先完成基础数据设置，再进行智能排课</p>
      <div class="module-cards">
        <a href="pages/base-data.html" class="module-card">
          <div class="icon" style="background:#e6f7ff;color:#1890ff;">👥</div>
          <h3>基础数据</h3>
          <p>管理教师、课程、班级等基础信息</p>
        </a>
        <a href="pages/course-arrange.html" class="module-card">
          <div class="icon" style="background:#f6ffed;color:#52c41a;">📋</div>
          <h3>课程安排</h3>
          <p>设置每个班级各课程的周课时数</p>
        </a>
        <a href="pages/teacher-arrange.html" class="module-card">
          <div class="icon" style="background:#fff7e6;color:#fa8c16;">👨‍🏫</div>
          <h3>教师安排</h3>
          <p>为每个班级各课程分配任课教师</p>
        </a>
        <a href="pages/workbench.html" class="module-card">
          <div class="icon" style="background:#f9f0ff;color:#722ed1;">🗓️</div>
          <h3>排课工作台</h3>
          <p>拖拽式智能排课，实时冲突检测</p>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
